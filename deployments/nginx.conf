map $request_method $jst_method { default OTHER; GET GET; HEAD HEAD; POST POST; PUT PUT; PATCH PATCH; DELETE DELETE; OPTIONS OPTIONS; }
log_format jst_safe '$jst_method $status $body_bytes_sent $request_time';
access_log /dev/stdout jst_safe;
error_log /dev/stderr crit;
server {
 listen 80;
 client_max_body_size 6m;
 root /usr/share/nginx/html;
 proxy_set_header X-Real-IP $remote_addr;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
 location /media/ { proxy_pass http://api:8080; }
 location /api/ { proxy_pass http://api:8080; }
 location = /healthz { proxy_pass http://api:8080; }
 location = /readyz { proxy_pass http://api:8080; }
 location / { try_files $uri $uri/ /index.html; }
}
